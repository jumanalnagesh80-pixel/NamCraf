<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Fraunces','Playfair Display',Georgia,serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4BC7"/>
      <stop offset="1" stop-color="#F26E86"/>
    </linearGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- perforated stamp frame -->
  <rect x="48" y="48" width="1104" height="534" rx="28" fill="none" stroke="#FBF5E9" stroke-width="4" stroke-dasharray="14 12" opacity="0.55"/>

  <!-- stamp star mark -->
  <g transform="translate(150 150)">
    <rect x="-20" y="-20" width="150" height="150" rx="30" fill="#F7D94C"/>
    <path d="M55 -2l14.7 29.8 32.9 4.8-23.8 23.2 5.6 32.8L55 77.2 25.6 92.6l5.6-32.8L7.4 36.6l32.9-4.8L55 -2z" fill="#2E4BC7"/>
  </g>

  <!-- eyebrow -->
  <text x="150" y="360" font-family="'Poppins',system-ui,sans-serif" font-size="30" font-weight="700" letter-spacing="8" fill="#F7D94C">NAMCRAFT · GRAPHIC STUDIO</text>

  <!-- headline -->
  <text x="146" y="452" font-size="128" font-weight="900" fill="#FEFAF0">Design anything</text>

  <!-- tagline -->
  <text x="150" y="520" font-family="'Poppins',system-ui,sans-serif" font-size="34" font-weight="500" fill="#FBF5E9" opacity="0.92">40+ studio templates · live editor · export PNG &amp; SVG</text>

  <!-- accent bar -->
  <rect x="150" y="548" width="150" height="14" rx="7" fill="#F26E86"/>
</svg>
